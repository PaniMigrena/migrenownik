<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Dzienniczek Migren</title>
<meta name="description" content="Prywatny dziennik ataków migreny — dane zapisywane wyłącznie na Twoim urządzeniu." />

<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#17171b" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Migrenownik" />

<link rel="stylesheet" href="app.css" />

<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5NL42JGWJR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-5NL42JGWJR');
</script>

<!--
  Zliczanie zapisanych wpisów migrenowych.
  Nie ingeruje w kod aplikacji (app.min.js) — po prostu nasłuchuje
  kliknięć w przycisk "Zapisz wpis" na poziomie całego dokumentu.
  Kliknięcia w "Zapisz zmiany" (edycja istniejącego wpisu) są
  celowo pomijane, żeby liczyć tylko NOWE wpisy.
-->
<script>
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (btn && btn.textContent.trim() === 'Zapisz wpis') {
      if (typeof gtag === 'function') {
        gtag('event', 'entry_saved', {
          event_category: 'migrenownik',
          event_label: 'nowy_wpis'
        });
      }
    }
  });
</script>

<style>
  html, body { background: #0c0c0e; margin: 0; }
  #root { min-height: 100vh; }
  #boot-status {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; padding: 32px; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #8f8d97; background: #0c0c0e;
  }
  #boot-status .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #9b8fb0;
    animation: boot-pulse 1.2s ease-in-out infinite;
  }
  @keyframes boot-pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  #boot-error { display: none; max-width: 320px; }
  #boot-error h2 { color: #dcdadf; font-size: 16px; margin: 0 0 8px; font-weight: 500; }
  #boot-error p { font-size: 13px; line-height: 1.5; margin: 0 0 6px; }
  #boot-error button {
    margin-top: 10px; background: #9b8fb0; color: #17171b; border: none;
    padding: 12px 20px; border-radius: 14px; font-size: 14px; cursor: pointer;
  }
</style>

<script>
  // Trwały zapis danych — WYŁĄCZNIE lokalnie w tej przeglądarce/na tym urządzeniu.
  // Każda osoba, która otworzy tę stronę na swoim telefonie, ma własne, niezależne dane.
  window.storage = {
    get: function (key) {
      return Promise.resolve().then(function () {
        var v = localStorage.getItem(key);
        return v === null ? null : { key: key, value: v };
      });
    },
    set: function (key, value) {
      return Promise.resolve().then(function () {
        localStorage.setItem(key, value);
        return { key: key, value: value };
      });
    },
  };
</script>
</head>
<body>
<noscript>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0c0c0e;color:#dcdadf;font-family:sans-serif;padding:24px;text-align:center;">
    Ta aplikacja wymaga włączonego JavaScriptu w przeglądarce.
  </div>
</noscript>

<div id="root">
  <div id="boot-status">
    <div class="dot"></div>
    <span>Wczytywanie Migrenownika…</span>
    <div id="boot-error">
      <h2>Coś poszło nie tak przy wczytywaniu</h2>
      <p>Aplikacja nie uruchomiła się w oczekiwanym czasie. Spróbuj:</p>
      <p>• odświeżyć stronę<br/>
         • sprawdzić połączenie z internetem<br/>
         • otworzyć link w zwykłej przeglądarce (nie w aplikacji typu Messenger/Instagram)</p>
      <button onclick="location.reload()">Spróbuj ponownie</button>
    </div>
  </div>
</div>

<script>
  window.__migrenownikBootTimer = setTimeout(function () {
    var boot = document.getElementById("boot-status");
    var err = document.getElementById("boot-error");
    var root = document.getElementById("root");
    if (boot && root && root.contains(boot)) {
      var dot = boot.querySelector(".dot");
      if (dot) dot.style.display = "none";
      if (err) err.style.display = "block";
    }
  }, 8000);

  window.addEventListener("error", function () {
    var boot = document.getElementById("boot-status");
    var err = document.getElementById("boot-error");
    var root = document.getElementById("root");
    if (boot && root && root.contains(boot) && err) {
      err.style.display = "block";
      var dot = boot.querySelector(".dot");
      if (dot) dot.style.display = "none";
    }
  });
</script>

<script src="react.min.js"></script>
<script src="react-dom.min.js"></script>
<script src="app.min.js"></script>

<script>
  // Rejestracja Service Workera — włącza działanie offline i instalowalność (PWA).
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function (err) {
        console.warn("Nie udało się zarejestrować Service Workera:", err);
      });
    });
  }
</script>
</body>
</html>
